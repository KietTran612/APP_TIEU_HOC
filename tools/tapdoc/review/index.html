<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duyệt âm thanh, tranh và tranh động — Tập đọc</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    body {
      margin: 0;
      padding: 16px 24px;
      background: #f7f8fa;
      color: #1f2937;
    }
    h1 {
      margin: 0 0 12px 0;
      font-size: 22px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
      background: #ffffff;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
    .tabs {
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      padding: 8px 16px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid #d1d5db;
      background: #f3f4f6;
      border-radius: 6px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }
    select, input[type="text"] {
      padding: 6px 10px;
      font-size: 14px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #ffffff;
    }
    .summary {
      margin-left: auto;
      font-size: 14px;
      color: #4b5563;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      vertical-align: middle;
      font-size: 14px;
    }
    th {
      background: #f9fafb;
      font-weight: 600;
    }
    .code-id {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 13px;
      color: #374151;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-dat { background: #dcfce7; color: #166534; }
    .status-khong_dat { background: #fee2e2; color: #991b1b; }
    .status-cho_duyet { background: #fef3c7; color: #92400e; }
    .status-chua_co { background: #e5e7eb; color: #4b5563; }
    .careful-badge {
      background: #dbeafe;
      color: #1e40af;
      margin-left: 6px;
    }
    .clip-pair { display: flex; gap: 8px; align-items: flex-start; }
    .clip {
      width: 240px;
      height: 240px;
      object-fit: cover;
      border-radius: 6px;
      background: #111827;
    }
    .clip.full { width: 320px; height: 180px; object-fit: contain; }
    .thumb {
      width: 160px;
      height: 160px;
      object-fit: contain;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      background: #f9fafb;
      display: block;
    }
    .actions {
      display: flex;
      gap: 6px;
    }
    .btn {
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      cursor: pointer;
    }
    .btn-ok:hover, .btn-ok.selected {
      background: #16a34a;
      color: #ffffff;
      border-color: #16a34a;
    }
    .btn-bad:hover, .btn-bad.selected {
      background: #dc2626;
      color: #ffffff;
      border-color: #dc2626;
    }
    .note-input {
      width: 100%;
      min-width: 180px;
      box-sizing: border-box;
    }
    .toast {
      position: fixed;
      bottom: 16px;
      right: 16px;
      padding: 10px 14px;
      border-radius: 6px;
      background: #1f2937;
      color: #ffffff;
      font-size: 13px;
      display: none;
    }
    input[type="number"] { width: 64px; padding: 6px; }
    [hidden] { display: none !important; }
    .tts-fields, .chain { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .tts-fields label { display: flex; flex-direction: column; gap: 4px; }
    .tts-panel, .lesson-chain { padding: 12px; background: white; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 12px; }
    .tts-panel h2 { margin-top: 0; font-size: 18px; }
    .tts-default-row { margin: 10px 0; }
    .tts-kind { display: block; margin-bottom: 4px; }
    .shown-text { font-size: 20px; font-weight: 600; min-width: 72px; max-width: 220px; }
    .shown-text.muted { color: #9ca3af; font-weight: 400; }
    #tts-default-rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 0 24px; }
    .pager { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin: 8px 0; }
    .pager > span, #pager-bottom { display: flex; gap: 8px; align-items: center; }
    #pager-bottom { justify-content: flex-end; }
    #search { padding: 6px 8px; min-width: 240px; }
    .bai-more { background: none; border: 0; padding: 0; color: #1d4ed8; cursor: pointer; white-space: nowrap; font: inherit; text-decoration: underline dotted; }
    #bai-popup { position: absolute; z-index: 50; width: 320px; max-height: 260px; overflow: auto; background: white;
                 border: 1px solid #d1d5db; border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .15); padding: 10px 12px; }
    .bai-popup-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .bai-popup-head .btn { padding: 0 8px; }
    .bai-popup-body { line-height: 1.6; }
    .tts-row td:last-child { min-width: 440px; }
    .tts-row audio { width: 230px; }
    .tts-row .note-input { width: 150px; min-width: 150px; }
    .tts-row .tts-fields input[type="text"] { width: 130px; padding: 6px; }
    .tts-default-row .tts-fields { align-items: flex-end; }
    .tts-stale { display: block; color: #92400e; }
    .playing { background: #dbeafe; }
    .actions { flex-wrap: wrap; }
    .table-wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Duyệt âm thanh, tranh và tranh động</h1>

  <div class="toolbar">
    <div class="tabs">
      <button type="button" id="tab-audio" class="tab-btn active">Âm thanh</button>
      <button type="button" id="tab-images" class="tab-btn">Tranh</button>
      <button type="button" id="tab-videos" class="tab-btn">Tranh động</button>
      <button type="button" id="tab-lesson" class="tab-btn">Nghe theo bài</button>
    </div>

    <label class="filter-group">
      <span>Trạng thái:</span>
      <select id="filter-status">
        <option value="">Tất cả</option>
        <option value="cho_duyet">Chờ duyệt (cho_duyet)</option>
        <option value="dat">Đạt (dat)</option>
        <option value="khong_dat">Không đạt (khong_dat)</option>
        <option value="chua_co">Chưa có (chua_co)</option>
      </select>
    </label>

    <label class="filter-group">
      <span>Bài:</span>
      <select id="filter-bai">
        <option value="">Tất cả</option>
      </select>
    </label>

    <label class="filter-group" id="search-wrap">
      <span>Tìm:</span>
      <input type="search" id="search" placeholder="Mã, lời đọc, cách đọc, ghi chú…" aria-label="Tìm">
    </label>

    <label class="filter-group" id="careful-filter-wrap">
      <input type="checkbox" id="filter-careful">
      <span>chỉ file cần nghe kỹ</span>
    </label>

    <label class="filter-group" id="crop-wrap">
      <input type="checkbox" id="clip-crop" checked>
      <span>xem cắt vuông như trong app</span>
    </label>

    <div class="summary" id="summary-text"></div>
  </div>

  <div id="tts-filters" class="toolbar">
    <label>Loại: <select id="filter-kind"><option value="">Tất cả</option></select></label>
    <label><input type="checkbox" id="filter-regen"> Cần tạo lại</label>
    <label><input type="checkbox" id="filter-overridden"> Đã chỉnh tay</label>
    <label>Giọng: <select id="filter-voice"><option value="">Tất cả</option><option value="cu">Bản cũ (chưa tạo lại)</option></select></label>
  </div>
  <section id="tts-defaults" class="tts-panel">
    <h2>Mặc định theo loại</h2>
    <p id="tts-default-voice"></p>
    <div id="tts-default-rows"></div>
    <p id="tts-regen-count"></p>
    <button type="button" id="tts-batch" class="btn">Tạo lại các mã cần tạo lại</button>
    <label><input type="checkbox" id="tts-include-approved"> Gồm mã đã duyệt</label>
    <progress id="tts-progress" value="0" max="1"></progress>
    <span id="tts-job" role="status"></span>
    <div id="tts-errors" role="alert"></div>
  </section>
  <section id="lesson-panel" class="tts-panel" hidden>
    <label>Chọn bài: <select id="lesson-select"></select></label>
    <button type="button" id="lesson-stop" class="btn">Dừng nghe</button>
    <div id="lesson-chains"></div>
  </section>
  <div class="pager" id="pager-top-wrap">
    <span id="pager-top"></span>
    <label>Mỗi trang: <select id="page-size"><option>20</option><option>50</option><option>100</option></select></label>
  </div>
  <div class="table-wrap" id="review-table"><table>
    <thead id="table-head"></thead>
    <tbody id="table-body"></tbody>
  </table></div>
  <div class="pager" id="pager-bottom"></div>

  <div class="toast" id="toast"></div>
  <div id="bai-popup" role="dialog" aria-label="Các bài dùng mã này" hidden></div>

  <script>
    (function () {
      let currentTab = "audio";
      let state = { audio: [], images: [], videos: [] };
      const rowElements = new Map();
      let ttsAvailable = false;
      let ttsDefaults = {};
      let ttsVoices = [];
      let ttsVoice = "vi-VN-HoaiMyNeural";
      let jobTimer;
      let playback = null;
      let lessonRequest = 0;
      let currentPage = 1;
      let pageSize = 20;
      let lastFilterKey = "";
      let searchTimer;
      const byId = (id) => document.getElementById(id);

      const tabAudioBtn = document.getElementById("tab-audio");
      const tabImagesBtn = document.getElementById("tab-images");
      const tabVideosBtn = document.getElementById("tab-videos");
      const listFor = (tab) => tab === "audio" ? state.audio : tab === "videos" ? state.videos : state.images;
      const filterStatus = document.getElementById("filter-status");
      const filterBai = document.getElementById("filter-bai");
      const filterCareful = document.getElementById("filter-careful");
      const carefulWrap = document.getElementById("careful-filter-wrap");
      const summaryText = document.getElementById("summary-text");
      const tableHead = document.getElementById("table-head");
      const tableBody = document.getElementById("table-body");
      const toastEl = document.getElementById("toast");

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.style.display = "block";
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => {
          toastEl.style.display = "none";
        }, 2000);
      }

      function populateLessonFilter() {
        const lessons = new Set();
        for (const list of [state.audio, state.images, state.videos]) {
          for (const row of list) {
            for (const b of row.bai || []) {
              lessons.add(b);
            }
          }
        }
        const current = filterBai.value;
        filterBai.textContent = "";
        const allOpt = document.createElement("option");
        allOpt.value = "";
        allOpt.textContent = "Tất cả";
        filterBai.appendChild(allOpt);
        for (const b of Array.from(lessons).sort()) {
          const opt = document.createElement("option");
          opt.value = b;
          opt.textContent = b;
          filterBai.appendChild(opt);
        }
        filterBai.value = current;
      }

      async function saveReview(manifest, row, newStatus, newNote) {
        const payload = {
          manifest: manifest,
          id: row.id,
          status: newStatus,
          ghi_chu: newNote
        };
        const resp = await fetch("/api/review", {
          method: "POST",
          headers: { "Content-Type": "application/json; charset=utf-8" },
          body: JSON.stringify(payload)
        });
        if (!resp.ok) {
          showToast("Lỗi lưu " + row.id);
          return;
        }
        const updated = await resp.json();
        Object.assign(row, updated);
        if (manifest === "audio") {
          if (newStatus === "dat") row.has_prev = false;
          row.needs_regen = row.status !== "dat" && Boolean(row.differs);
          updateTtsRow(row);
        }
        const els = rowElements.get(row);
        if (els) {
          els.sBadge.className = "badge status-" + row.status;
          els.sBadge.textContent = row.status;
          els.btnOk.classList.toggle("selected", row.status === "dat");
          els.btnBad.classList.toggle("selected", row.status === "khong_dat");
          if (document.activeElement !== els.noteInput) {
            els.noteInput.value = row.ghi_chu || "";
          }
        }
        showToast("Đã lưu " + row.id);
      }

      function submitReview(manifest, row, status, note) {
        if (manifest === "audio") return queueRow(row, () => saveReview(manifest, row, status, note));
        return saveReview(manifest, row, status, note).catch(error => showToast(error.message));
      }

      // Bỏ dấu để gõ "san" vẫn tìm ra "sàn"; gõ có dấu thì tìm đúng dấu.
      const fold = (text) => String(text || "").normalize("NFD").replace(/[̀-ͯ]/g, "")
        .replace(/[đĐ]/g, "d").toLowerCase();

      function rowVoice(row) {
        return String(row.source || "").startsWith("tts_edge_") && row.tts ? row.tts.voice : "cu";
      }

      function filteredRows() {
        const list = listFor(currentTab);
        const st = filterStatus.value;
        const bai = filterBai.value;
        const carefulOnly = currentTab === "audio" && filterCareful.checked;
        const query = byId("search").value.trim().normalize("NFC");
        const exactId = query && list.some(row => row.id === query);
        const marked = fold(query) !== query.toLowerCase();
        return list.filter((row) => {
          if (st && row.status !== st) return false;
          if (bai && !(row.bai || []).includes(bai)) return false;
          if (carefulOnly && !row.can_nghe_ky) return false;
          if (exactId && row.id !== query) return false;
          if (query && !exactId) {
            const hay = [row.id, ...(row.hien_thi || []), row.text, row.mo_ta, row.params && row.params.doc, row.ghi_chu].filter(Boolean).join(" ");
            if (marked ? !hay.toLowerCase().includes(query.toLowerCase()) : !fold(hay).includes(fold(query))) return false;
          }
          if (currentTab === "audio") {
            if (byId("filter-kind").value && row.kind !== byId("filter-kind").value) return false;
            if (byId("filter-voice").value && rowVoice(row) !== byId("filter-voice").value) return false;
            if (byId("filter-regen").checked && !row.needs_regen) return false;
            if (byId("filter-overridden").checked && !row.overridden) return false;
          }
          return true;
        });
      }

      function renderPager(pages) {
        for (const id of ["pager-top", "pager-bottom"]) {
          const el = byId(id);
          el.textContent = "";
          const prev = button("‹ Trước", () => goPage(currentPage - 1, id === "pager-bottom"));
          prev.disabled = currentPage <= 1;
          const info = document.createElement("span");
          info.textContent = "Trang " + currentPage + " / " + pages;
          const next = button("Sau ›", () => goPage(currentPage + 1, id === "pager-bottom"));
          next.disabled = currentPage >= pages;
          el.append(prev, info, next);
        }
      }

      function goPage(page, scroll) {
        currentPage = page;
        render();
        if (scroll) byId("pager-top-wrap").scrollIntoView({ block: "start" });
      }

      function baiCell(td, bai) {
        const short = bai.map(b => b.replace(/^tv1_t1_/, ""));
        if (short.length <= 3) {
          td.textContent = short.join(", ");
          return;
        }
        // Mã dùng ở nhiều bài: ô chỉ ghi gọn một dòng, bấm mở khung nhỏ ghi đủ để không vỡ cột.
        const more = document.createElement("button");
        more.type = "button";
        more.className = "bai-more";
        more.textContent = short.slice(0, 2).join(", ") + " … +" + (short.length - 2);
        more.title = "Xem đủ " + short.length + " bài";
        more.addEventListener("click", (event) => {
          event.stopPropagation();
          showBaiPopup(more, short);
        });
        td.appendChild(more);
      }

      function showBaiPopup(anchor, short) {
        const popup = byId("bai-popup");
        popup.textContent = "";
        const head = document.createElement("div");
        head.className = "bai-popup-head";
        const title = document.createElement("strong");
        title.textContent = "Dùng trong " + short.length + " bài";
        const close = button("×", hideBaiPopup);
        close.setAttribute("aria-label", "Đóng");
        head.append(title, close);
        const body = document.createElement("div");
        body.className = "bai-popup-body";
        body.textContent = short.join(", ");
        popup.append(head, body);
        popup.hidden = false;
        const rect = anchor.getBoundingClientRect();
        const left = Math.min(rect.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - popup.offsetWidth - 16);
        popup.style.left = Math.max(8, left) + "px";
        popup.style.top = (rect.bottom + window.scrollY + 4) + "px";
      }

      function hideBaiPopup() {
        byId("bai-popup").hidden = true;
      }
      document.addEventListener("click", (event) => {
        if (!byId("bai-popup").contains(event.target)) hideBaiPopup();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") hideBaiPopup();
      });

      function render() {
        stopPlayback();
        const isLesson = currentTab === "lesson";
        byId("lesson-panel").hidden = !isLesson;
        byId("review-table").hidden = isLesson;
        byId("tts-defaults").hidden = currentTab !== "audio";
        byId("tts-filters").hidden = currentTab !== "audio";
        byId("tab-lesson").classList.toggle("active", isLesson);
        filterStatus.parentElement.hidden = isLesson;
        filterBai.parentElement.hidden = isLesson;
        byId("search-wrap").hidden = isLesson;
        byId("pager-top-wrap").hidden = isLesson;
        byId("pager-bottom").hidden = isLesson;
        if (isLesson) {
          tabAudioBtn.classList.remove("active");
          tabImagesBtn.classList.remove("active");
          tabVideosBtn.classList.remove("active");
          carefulWrap.style.display = "none";
          byId("crop-wrap").style.display = "none";
          summaryText.textContent = "Nghe từng mảnh, nghỉ 0,5 giây giữa các mảnh";
          return;
        }
        carefulWrap.style.display = currentTab === "audio" ? "flex" : "none";
        tabAudioBtn.classList.toggle("active", currentTab === "audio");
        tabImagesBtn.classList.toggle("active", currentTab === "images");
        tabVideosBtn.classList.toggle("active", currentTab === "videos");
        byId("crop-wrap").style.display = currentTab === "videos" ? "flex" : "none";

        tableHead.textContent = "";
        const headRow = document.createElement("tr");
        const headers = currentTab === "audio"
          ? ["Mã", "Hiển thị", "Lời đọc", "Loại", "Bài", "Nghe thử", "Trạng thái", "Duyệt", "Ghi chú", "Chỉnh giọng đọc"]
          : currentTab === "videos"
            ? ["Mã", "Mô tả", "Bài", "Tranh gốc và clip (bấm phát để nghe)", "Trạng thái", "Duyệt", "Ghi chú"]
            : ["Mã", "Mô tả", "Bài", "Ảnh (160 px)", "Trạng thái", "Duyệt", "Ghi chú"];
        for (const h of headers) {
          const th = document.createElement("th");
          th.textContent = h;
          headRow.appendChild(th);
        }
        tableHead.appendChild(headRow);

        const rows = filteredRows();
        const total = listFor(currentTab).length;
        // Đổi tab, bộ lọc, ô tìm hay cỡ trang thì quay về trang 1.
        const filterKey = JSON.stringify([currentTab, filterStatus.value, filterBai.value, filterCareful.checked,
          byId("filter-kind").value, byId("filter-voice").value, byId("filter-regen").checked,
          byId("filter-overridden").checked, byId("search").value.trim(), pageSize]);
        if (filterKey !== lastFilterKey) {
          currentPage = 1;
          lastFilterKey = filterKey;
        }
        const pages = Math.max(1, Math.ceil(rows.length / pageSize));
        currentPage = Math.min(Math.max(1, currentPage), pages);
        summaryText.textContent = "Khớp " + rows.length + " / " + total + " mục";
        renderPager(pages);

        tableBody.textContent = "";
        rowElements.clear();
        for (const row of rows.slice((currentPage - 1) * pageSize, currentPage * pageSize)) {
          const tr = document.createElement("tr");
          if (currentTab === "audio") tr.className = "tts-row";

          const tdId = document.createElement("td");
          tdId.className = "code-id";
          tdId.textContent = row.id;
          tr.appendChild(tdId);

          if (currentTab === "audio") {
            // Chữ bé nhìn thấy trong app khi mã này được đọc.
            const tdShown = document.createElement("td");
            tdShown.className = "shown-text";
            const shownList = row.hien_thi || [];
            if (shownList.length) {
              tdShown.textContent = shownList.join(" · ");  // không tách "d · D" sang hai dòng
            } else {
              tdShown.textContent = "—";
              tdShown.classList.add("muted");
              tdShown.title = "Chỉ đọc, không hiện chữ (lời hướng dẫn, lời khen, câu hỏi chọn tranh)";
            }
            tr.appendChild(tdShown);
          }

          const tdText = document.createElement("td");
          tdText.textContent = currentTab === "audio" ? row.text : row.mo_ta;
          if (currentTab === "audio" && row.can_nghe_ky) {
            const cBadge = document.createElement("span");
            cBadge.className = "badge careful-badge";
            cBadge.textContent = "cần nghe kỹ";
            tdText.appendChild(cBadge);
          }
          tr.appendChild(tdText);

          if (currentTab === "audio") {
            const tdKind = document.createElement("td");
            tdKind.textContent = row.kind || "";
            tr.appendChild(tdKind);
          }

          const tdBai = document.createElement("td");
          baiCell(tdBai, row.bai || []);
          tr.appendChild(tdBai);

          const tdMedia = document.createElement("td");
          if (currentTab === "audio") {
            const audio = document.createElement("audio");
            audio.controls = true;
            audio.preload = "none";
            audio.src = "/media/audio/" + encodeURIComponent(row.id) + ".mp3";
            tdMedia.appendChild(audio);
          } else if (currentTab === "videos") {
            const pair = document.createElement("div");
            pair.className = "clip-pair";
            const img = document.createElement("img");
            img.className = "thumb";
            img.alt = row.id;
            img.loading = "lazy";
            img.src = "/media/images/" + encodeURIComponent(row.id) + ".png";
            const video = document.createElement("video");
            video.className = "clip" + (byId("clip-crop").checked ? "" : " full");
            video.controls = true;
            video.loop = true;
            video.preload = "none";
            video.poster = img.src;
            video.src = "/media/clips/" + encodeURIComponent(row.id) + ".mp4";
            // Mỗi lúc chỉ một clip phát tiếng.
            video.addEventListener("play", () => {
              for (const other of tableBody.querySelectorAll("video")) if (other !== video) other.pause();
            });
            pair.append(img, video);
            tdMedia.appendChild(pair);
          } else {
            const img = document.createElement("img");
            img.className = "thumb";
            img.alt = row.id;
            img.loading = "lazy";
            img.src = "/media/images/" + encodeURIComponent(row.id) + ".png";
            tdMedia.appendChild(img);
          }
          tr.appendChild(tdMedia);

          const tdStatus = document.createElement("td");
          const sBadge = document.createElement("span");
          sBadge.className = "badge status-" + row.status;
          sBadge.textContent = row.status;
          tdStatus.appendChild(sBadge);
          tr.appendChild(tdStatus);

          const tdActions = document.createElement("td");
          const actWrap = document.createElement("div");
          actWrap.className = "actions";

          const btnOk = document.createElement("button");
          btnOk.type = "button";
          btnOk.className = "btn btn-ok" + (row.status === "dat" ? " selected" : "");
          btnOk.textContent = "Đạt";

          const btnBad = document.createElement("button");
          btnBad.type = "button";
          btnBad.className = "btn btn-bad" + (row.status === "khong_dat" ? " selected" : "");
          btnBad.textContent = "Không đạt";

          const tdNote = document.createElement("td");
          const noteInput = document.createElement("input");
          noteInput.type = "text";
          noteInput.className = "note-input";
          noteInput.value = row.ghi_chu || "";
          noteInput.placeholder = "Ghi chú...";

          const manifest = currentTab;
          btnOk.addEventListener("click", () => {
            submitReview(manifest, row, "dat", noteInput.value);
          });
          btnBad.addEventListener("click", () => {
            submitReview(manifest, row, "khong_dat", noteInput.value);
          });
          noteInput.addEventListener("blur", () => {
            if (noteInput.value !== (row.ghi_chu || "")) {
              const targetStatus = row.status === "chua_co" ? "cho_duyet" : row.status;
              submitReview(manifest, row, targetStatus, noteInput.value);
            }
          });

          actWrap.appendChild(btnOk);
          actWrap.appendChild(btnBad);
          tdActions.appendChild(actWrap);
          tr.appendChild(tdActions);

          tdNote.appendChild(noteInput);
          tr.appendChild(tdNote);

          rowElements.set(row, {
            tr: tr,
            tdStatus: tdStatus,
            sBadge: sBadge,
            btnOk: btnOk,
            btnBad: btnBad,
            noteInput: noteInput
          });

          if (currentTab === "audio") addTtsControls(row, tr);
          tableBody.appendChild(tr);
        }
      }

      tabAudioBtn.addEventListener("click", () => {
        currentTab = "audio";
        render();
      });
      tabImagesBtn.addEventListener("click", () => {
        currentTab = "images";
        render();
      });
      tabVideosBtn.addEventListener("click", () => {
        currentTab = "videos";
        render();
      });
      byId("clip-crop").addEventListener("change", () => {
        for (const video of tableBody.querySelectorAll("video.clip")) {
          video.classList.toggle("full", !byId("clip-crop").checked);
        }
      });
      filterStatus.addEventListener("change", render);
      filterBai.addEventListener("change", render);
      filterCareful.addEventListener("change", render);

      async function api(path, payload) {
        const response = await fetch(path, payload === undefined ? {} : {
          method: "POST",
          headers: { "Content-Type": "application/json; charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Không thực hiện được yêu cầu");
        return result;
      }

      function button(text, action) {
        const el = document.createElement("button");
        el.type = "button";
        el.className = "btn";
        el.textContent = text;
        el.addEventListener("click", action);
        return el;
      }

      function parameterInput(parent, label, key, value) {
        const wrap = document.createElement("label");
        wrap.textContent = label;
        const input = document.createElement("input");
        input.type = key === "doc" ? "text" : "number";
        input.value = value;
        input.setAttribute("aria-label", label);
        // Âm lượng là mức chỉnh thêm so với gốc, 0 không phải tắt tiếng.
        if (key === "volume") wrap.title = "0 = giữ độ to gốc của giọng; -50 = nhỏ một nửa; +50 = to hơn 50%";
        if (key !== "doc") {
          const limits = { rate: [-60, 30], pitch: [-30, 30], volume: [-50, 50] }[key];
          input.min = limits[0];
          input.max = limits[1];
          input.step = 1;
        }
        wrap.appendChild(input);
        parent.appendChild(wrap);
        return input;
      }

      function inputValues(inputs) {
        const values = {};
        for (const [key, input] of Object.entries(inputs)) {
          if (!input.checkValidity() || (key !== "doc" && !input.value.trim())) {
            input.reportValidity();
            throw new Error("Thông số phải nằm trong giới hạn cho phép");
          }
          values[key] = (key === "doc" || key === "voice") ? input.value : Number(input.value);
        }
        return values;
      }

      function updateRegenCount() {
        byId("tts-regen-count").textContent = state.audio.filter(r => r.needs_regen).length + " mã cần tạo lại";
      }

      function updateTtsRow(row, reloadAudio = false) {
        const els = rowElements.get(row);
        if (!els) return;
        els.sBadge.className = "badge status-" + row.status;
        els.sBadge.textContent = row.status;
        els.btnOk.classList.toggle("selected", row.status === "dat");
        els.btnBad.classList.toggle("selected", row.status === "khong_dat");
        if (document.activeElement !== els.noteInput) els.noteInput.value = row.ghi_chu || "";
        if (els.tts) {
          for (const [key, input] of Object.entries(els.tts.inputs)) {
            if (document.activeElement !== input) input.value = (row.params || {})[key] ?? (key === "doc" ? row.text : key === "voice" ? ttsVoice : 0);
          }
          els.tts.badge.textContent = row.needs_regen ? "cần tạo lại" : row.differs ? "khác mặc định mới" : "";
          els.tts.previous.hidden = !row.has_prev;
          els.tts.restore.hidden = !row.has_prev;
          if (reloadAudio) {
            const audio = els.tr.querySelector("audio");
            if (audio) {
              audio.src = "/media/audio/" + encodeURIComponent(row.id) + ".mp3?v=" + Date.now();
              audio.load();
            }
          }
        }
        updateRegenCount();
      }

      function queueRow(row, operation) {
        // Lưu cách đọc trước khi tạo; thao tác trên cùng mã theo đúng thứ tự bấm.
        row._pending = (row._pending || Promise.resolve()).then(operation).catch(error => {
          showToast(error.message);
        });
        return row._pending;
      }

      function addTtsControls(row, tr) {
        const td = document.createElement("td");
        const fields = document.createElement("div");
        fields.className = "tts-fields";
        const params = row.params || { doc: row.text, rate: 0, pitch: 0, volume: 0 };
        const inputs = {};
        const voice = document.createElement("select");
        voice.className = "tts-voice";
        voice.setAttribute("aria-label", "Giọng");
        for (const item of ttsVoices) {
          const option = document.createElement("option");
          option.value = item.id;
          option.textContent = item.label;
          voice.appendChild(option);
        }
        voice.value = params.voice || ttsVoice;
        voice.disabled = !ttsAvailable;
        inputs.voice = voice;
        const voiceWrap = document.createElement("label");
        voiceWrap.textContent = "Giọng";
        voiceWrap.appendChild(voice);
        fields.appendChild(voiceWrap);
        voice.addEventListener("change", () => {
          let values;
          try { values = inputValues(inputs); } catch (error) { showToast(error.message); return; }
          queueRow(row, async () => {
            Object.assign(row, await api("/api/tts/row", { id: row.id, ...values }));
            updateTtsRow(row);
          });
        });
        for (const [key, label] of [["doc", "Cách đọc"], ["rate", "Tốc độ (%)"], ["pitch", "Cao độ (Hz)"], ["volume", "Âm lượng (%)"]]) {
          inputs[key] = parameterInput(fields, label, key, params[key]);
          inputs[key].disabled = !ttsAvailable;
          inputs[key].addEventListener("change", () => {
            let values;
            try { values = inputValues(inputs); } catch (error) { showToast(error.message); return; }
            queueRow(row, async () => {
              Object.assign(row, await api("/api/tts/row", { id: row.id, ...values }));
              updateTtsRow(row);
            });
          });
        }
        const actions = document.createElement("div");
        actions.className = "actions";
        const play = (previous) => {
          stopPlayback();
          const audio = new Audio((previous ? "/media/prev/" : "/media/audio/") + encodeURIComponent(row.id) + ".mp3?v=" + Date.now());
          playback = { audio };
          audio.play().catch(error => showToast("Không nghe được " + row.id + ": " + error.message));
        };
        const generate = button("Tạo lại", () => queueRow(row, async () => {
          generate.disabled = true;
          try {
            Object.assign(row, await api("/api/tts/generate", { id: row.id }));
            updateTtsRow(row, true);
            showToast("Đã tạo " + row.id);
          } finally { generate.disabled = false; }
        }));
        generate.disabled = !ttsAvailable;
        const listen = button("Nghe", () => play(false));
        const previous = button("Nghe bản trước", () => play(true));
        const restore = button("Dùng lại bản trước", () => queueRow(row, async () => {
          Object.assign(row, await api("/api/tts/restore", { id: row.id }));
          updateTtsRow(row, true);
          showToast("Đã dùng lại bản trước " + row.id);
        }));
        actions.append(generate, listen, previous, restore);
        const badge = document.createElement("span");
        badge.className = "tts-stale";
        td.append(fields, actions, badge);
        tr.appendChild(td);
        rowElements.get(row).tts = { inputs, badge, previous, restore };
        updateTtsRow(row);
      }

      async function refreshTts(reloadAudio = false) {
        const data = await api("/api/tts");
        ttsDefaults = data.defaults;
        ttsVoices = data.voices;
        ttsVoice = data.voice;
        byId("tts-default-voice").textContent = "Giọng mặc định: " + (ttsVoices.find(v => v.id === ttsVoice)?.label || ttsVoice);
        for (const updated of data.rows) {
          const row = state.audio.find(r => r.id === updated.id);
          if (row) {
            const changedAudio = JSON.stringify(row.tts) !== JSON.stringify(updated.tts);
            Object.assign(row, updated);
            updateTtsRow(row, reloadAudio && changedAudio);
          }
        }
        updateRegenCount();
      }

      const KIND_LABELS = { am: "âm", van: "vần", dau: "dấu thanh", tieng: "tiếng", tu: "từ", cau: "câu",
                            huong_dan: "lời hướng dẫn", khen: "lời khen" };

      function buildDefaults() {
        const container = byId("tts-default-rows");
        container.textContent = "";
        for (const [kind, params] of Object.entries(ttsDefaults)) {
          const option = document.createElement("option");
          option.value = kind;
          option.textContent = kind;
          byId("filter-kind").appendChild(option);
          // Tên loại một dòng riêng để các ô thông số của mọi loại thẳng cột.
          const block = document.createElement("div");
          block.className = "tts-default-row";
          const title = document.createElement("strong");
          title.className = "tts-kind";
          title.textContent = kind + (KIND_LABELS[kind] ? " — " + KIND_LABELS[kind] : "");
          const line = document.createElement("div");
          line.className = "tts-fields";
          block.append(title, line);
          const inputs = {};
          for (const [key, label] of [["rate", "Tốc độ (%)"], ["pitch", "Cao độ (Hz)"], ["volume", "Âm lượng (%)"]]) {
            inputs[key] = parameterInput(line, label, key, params[key]);
          }
          const save = button("Lưu", async () => {
            try {
              const values = inputValues(inputs);
              save.disabled = true;
              const result = await api("/api/tts/defaults", { kind, ...values });
              await refreshTts();
              showToast("Đã lưu " + kind + "; " + result.needs_regen + " mã cần tạo lại");
            } catch (error) { showToast(error.message); }
            finally { save.disabled = false; }
          });
          line.appendChild(save);
          container.appendChild(block);
        }
        updateRegenCount();
      }

      let lastJob = "";
      async function pollJob() {
        clearTimeout(jobTimer);
        try {
          const job = await api("/api/tts/job");
          byId("tts-batch").disabled = job.running || !ttsAvailable;
          byId("tts-progress").max = Math.max(1, job.total);
          byId("tts-progress").value = job.done + Object.keys(job.failed).length;
          byId("tts-job").textContent = (job.running ? "Đang tạo " : "Đã tạo ") + job.done + "/" + job.total + (job.current ? " — " + job.current : "");
          byId("tts-errors").textContent = Object.entries(job.failed).map(([id, message]) => id + ": " + message).join("; ");
          const signature = JSON.stringify(job);
          if (signature !== lastJob && ttsAvailable) await refreshTts(true);
          lastJob = signature;
        } catch (error) { showToast(error.message); }
        finally { jobTimer = setTimeout(pollJob, 1000); }
      }

      byId("tts-batch").addEventListener("click", async () => {
        try {
          byId("tts-batch").disabled = true;
          const payload = { include_approved: byId("tts-include-approved").checked };
          if (filterBai.value) payload.lesson = filterBai.value;
          if (byId("filter-kind").value) payload.kind = byId("filter-kind").value;
          await api("/api/tts/batch", payload);
          await pollJob();
        } catch (error) { showToast(error.message); byId("tts-batch").disabled = false; }
      });
      for (const id of ["filter-kind", "filter-voice", "filter-regen", "filter-overridden"]) {
        byId(id).addEventListener("change", render);
      }
      byId("search").addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(render, 250);
      });
      byId("page-size").addEventListener("change", () => {
        pageSize = Number(byId("page-size").value);
        render();
      });

      function stopPlayback() {
        if (!playback) return;
        const active = playback;
        playback = null;
        active.audio.pause();
        clearTimeout(active.timer);
        if (active.finish) active.finish();
      }

      async function playChain(parts, buttons) {
        stopPlayback();
        const active = { audio: new Audio(), timer: null, finish: null };
        playback = active;
        try {
          for (let i = 0; i < parts.length && playback === active; i++) {
            buttons[i].classList.add("playing");
            try {
              await new Promise((resolve, reject) => {
                active.finish = resolve;
                active.audio.onended = resolve;
                active.audio.onerror = () => reject(new Error("Chưa nghe được " + parts[i].audio));
                active.audio.src = "/media/audio/" + encodeURIComponent(parts[i].audio) + ".mp3?v=" + Date.now();
                active.audio.play().catch(reject);
              });
            } finally { buttons[i].classList.remove("playing"); }
            if (i + 1 < parts.length && playback === active) {
              await new Promise(resolve => {
                active.finish = resolve;
                active.timer = setTimeout(resolve, 500);
              });
            }
          }
        } catch (error) { showToast(error.message); }
        finally {
          if (playback === active) playback = null;
          active.audio.pause();
          buttons.forEach(b => b.classList.remove("playing"));
        }
      }

      function jumpToAudio(id) {
        stopPlayback();
        currentTab = "audio";
        filterStatus.value = "";
        filterBai.value = "";
        filterCareful.checked = false;
        byId("filter-kind").value = "";
        byId("filter-regen").checked = false;
        byId("filter-overridden").checked = false;
        byId("filter-voice").value = "";
        byId("search").value = id;
        render();
      }

      function lessonChain(lesson, where, chain, parts, notes) {
        parts = parts.filter(part => part.audio);
        if (!parts.length) return;
        const panel = document.createElement("div");
        panel.className = "lesson-chain";
        const title = document.createElement("p");
        title.textContent = where + " — " + chain;
        const line = document.createElement("div");
        line.className = "chain";
        const pieces = parts.map(part => {
          const b = button(part.text || part.audio, () => jumpToAudio(part.audio));
          b.title = part.audio + " — mở mã âm thanh";
          return b;
        });
        line.append(button("▶ Nghe chuỗi", () => playChain(parts, pieces)), ...pieces);
        const note = document.createElement("input");
        note.type = "text";
        note.className = "note-input";
        note.placeholder = "Ghi chú chuỗi đánh vần...";
        note.setAttribute("aria-label", "Ghi chú " + chain);
        let saved = (notes.find(n => n.lesson === lesson && n.where === where && n.chain === chain) || {}).note || "";
        note.value = saved;
        let saving = Promise.resolve();
        note.addEventListener("change", () => {
          const value = note.value;
          saving = saving.then(async () => {
            if (value === saved) return;
            await api("/api/chain-notes", { lesson, where, chain, note: value });
            saved = value;
            showToast("Đã lưu ghi chú chuỗi");
          }).catch(error => showToast(error.message));
        });
        panel.append(title, line, note);
        byId("lesson-chains").appendChild(panel);
      }

      async function loadLesson() {
        stopPlayback();
        const request = ++lessonRequest;
        const id = byId("lesson-select").value;
        byId("lesson-chains").textContent = "Đang đọc bài...";
        if (!id) return;
        try {
          const [lesson, notes] = await Promise.all([api("/api/lesson/" + encodeURIComponent(id)), api("/api/chain-notes")]);
          if (request !== lessonRequest) return;
          byId("lesson-chains").textContent = "";
          (lesson.part1 || []).forEach((step, index) => {
            const where = "part1[" + index + "]";
            if (step.spell && step.spell.parts) {
              const parts = [...step.spell.parts];
              if (step.then_audio) parts.push({ audio: step.then_audio, text: step.then_text });
              lessonChain(id, where + ".spell", step.spell.target, parts, notes);
            }
            if (step.audio) lessonChain(id, where, step.text || step.type, [{ audio: step.audio, text: step.text }], notes);
            if (step.type === "sentence") {
              lessonChain(id, where + ".items", step.text, step.items || [], notes);
            }
            (step.items || []).forEach((item, itemIndex) => {
              // Phát như app: nối mảnh của mọi tiếng rồi đọc cả mục (ItemsView.OnReadingTapped).
              const parts = (item.spells || []).flatMap(spell => spell.parts || []);
              if (!parts.length) return;
              if (item.audio && parts[parts.length - 1].audio !== item.audio) parts.push({ audio: item.audio, text: item.text });
              lessonChain(id, where + ".items[" + itemIndex + "]", item.text, parts, notes);
            });
          });
          if (!byId("lesson-chains").children.length) byId("lesson-chains").textContent = "Bài chưa có chuỗi âm thanh.";
        } catch (error) { if (request === lessonRequest) byId("lesson-chains").textContent = error.message; }
      }

      async function loadLessons() {
        try {
          const lessons = await api("/api/lessons");
          for (const lesson of lessons) {
            const option = document.createElement("option");
            option.value = lesson.lesson_id;
            option.textContent = "Bài " + lesson.lesson_no + " — " + lesson.title;
            byId("lesson-select").appendChild(option);
          }
          await loadLesson();
        } catch (error) { byId("lesson-chains").textContent = error.message; }
      }
      byId("lesson-select").addEventListener("change", loadLesson);
      byId("lesson-stop").addEventListener("click", stopPlayback);
      byId("tab-lesson").addEventListener("click", () => { currentTab = "lesson"; render(); });

      async function loadData() {
        try {
          state = await api("/api/data");
          // Clip dùng mô tả và danh sách bài của tranh cùng mã.
          const imageById = new Map(state.images.map(row => [row.id, row]));
          for (const clip of state.videos || []) {
            const image = imageById.get(clip.id) || {};
            clip.mo_ta = image.mo_ta || "";
            clip.bai = image.bai || [];
          }
          state.videos = state.videos || [];
          try {
            const data = await api("/api/tts");
            state.audio = data.rows;
            ttsDefaults = data.defaults;
            ttsVoices = data.voices;
            ttsVoice = data.voice;
            byId("tts-default-voice").textContent = "Giọng mặc định: " + (ttsVoices.find(v => v.id === ttsVoice)?.label || ttsVoice);
            ttsAvailable = true;
            const oldOption = byId("filter-voice").querySelector('option[value="cu"]');
            for (const item of ttsVoices) {
              const option = document.createElement("option");
              option.value = item.id;
              option.textContent = item.label;
              byId("filter-voice").insertBefore(option, oldOption);
            }
            buildDefaults();
          } catch (error) { showToast(error.message); }
          populateLessonFilter();
          render();
          await loadLessons();
          pollJob();
        } catch (error) { showToast(error.message); }
      }

      loadData();
    })();
  </script>
</body>
