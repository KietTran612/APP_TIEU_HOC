<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Màn học</title><link rel="stylesheet" href="mau.css"></head>
<body><div class="screen">
  <!-- Nút nhà, loa (giữ chỗ cũ) -->
  <div class="round-btn" style="left:10px;top:10px"><img src="../../../../unity/TapDoc/Assets/Content/Resources/images/img_ui_nha.png"></div>
  <div class="round-btn big" style="left:5px;top:440px;width:90px;height:90px"><img src="../../../../unity/TapDoc/Assets/Content/Resources/images/img_ui_loa.png"></div>

  <!-- 1. Con đường bài học: hạt to, gà con đứng ở bước đang học, cuối đường là bông hoa của Sổ -->
  <svg style="position:absolute;left:250px;top:0px" width="700" height="40">
    <path d="M10 22 Q 90 8 175 20 T 345 20 T 515 20 T 660 19" fill="none" stroke="#2B2621" stroke-width="2.5" stroke-dasharray="7 7"/>
  </svg>
  <div id="beads"></div>
  <div class="chick" id="token" style="width:34px;height:34px;border-radius:50%;background:#EF9D4F;border:1.5px solid #2B2621;overflow:hidden"><img src="../../../../unity/TapDoc/Assets/Content/Resources/images/img_chung_ga_con.png"></div>
  <img src="../../../../unity/TapDoc/Assets/Content/Resources/images/img_chung_hoa_be_ngoan.png" style="position:absolute;left:912px;top:1px;width:34px;height:34px">
  <div class="mark" style="left:215px;top:4px">1</div>

  <!-- 4. Nội dung to hơn, dùng khoảng trống -->
  <div class="card" style="position:absolute;left:150px;top:60px;width:440px;height:440px;display:flex;align-items:center;justify-content:center">
    <img src="../../../../unity/TapDoc/Assets/Content/Resources/images/img_b13_cuwr_taj.png" style="width:400px;height:400px;border-radius:6px">
  </div>
  <div class="card" style="position:absolute;left:640px;top:170px;width:420px;height:220px;display:flex;align-items:center;justify-content:center;font-size:118px;line-height:1">
    <span>c<span style="color:var(--teal)">ử</span> tạ</span>
  </div>
  <div class="mark" style="left:135px;top:48px">4</div>

  <!-- 2. Gà con làm bạn học: đứng cạnh thẻ chữ, chỉ vào chữ đang đọc, bong bóng có hình loa khi đọc -->
  <div class="chick" style="left:1105px;top:215px;width:90px;height:90px"><img src="../../../../unity/TapDoc/Assets/Content/Resources/images/img_chung_ga_con.png"></div>
  <div class="bubble tail-down" style="left:1110px;top:150px;padding:8px 10px"><img src="../../../../unity/TapDoc/Assets/Content/Resources/images/img_ui_loa.png"></div>
  <div class="mark" style="left:1090px;top:140px">2</div>

  <!-- 5. Nút Tiếp to hơn; 3. bàn tay gợi ý khi bé ngồi im -->
  <div class="round-btn big orange" style="left:1105px;top:440px;width:90px;height:90px;box-shadow:0 0 0 10px rgba(244,197,74,.45)"><img src="../../../../unity/TapDoc/Assets/Content/Resources/images/img_ui_tiep.png"></div>
  <div style="position:absolute;left:1040px;top:380px;font-size:60px;transform:rotate(-30deg)">👆</div>
  <div class="mark" style="left:1165px;top:505px">5</div>
  <div class="mark" style="left:1050px;top:345px">3</div>
</div>
<script>
  // 18 hạt dọc con đường: 5 hạt đã qua (xanh), hạt 6 đang học (cam), còn lại giấy sáng.
  const pts = []; const path = document.querySelector('path');
  const len = path.getTotalLength();
  for (let i = 0; i < 18; i++) { const p = path.getPointAtLength(10 + i * (len - 20) / 17); pts.push(p); }
  const host = document.getElementById('beads');
  pts.forEach((p, i) => {
    const d = document.createElement('div');
    const s = i === 5 ? 28 : 20;
    d.style.cssText = `position:absolute;left:${250 + p.x - s/2}px;top:${p.y - s/2}px;width:${s}px;height:${s}px;border-radius:50%;border:1.5px solid #2B2621;background:${i < 5 ? '#2F8C9B' : i === 5 ? '#EF9D4F' : '#FBF6E9'}`;
    host.appendChild(d);
  });
  const t = document.getElementById('token'); t.style.left = (250 + pts[5].x - 17) + 'px'; t.style.top = (pts[5].y - 17) + 'px';
</script>
</body></html>
