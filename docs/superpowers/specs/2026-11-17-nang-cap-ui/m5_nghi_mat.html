<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Nghỉ mắt</title><link rel="stylesheet" href="mau.css"></head>
<body><div class="screen">
  <!-- Hiện sau khi xong bài (điểm dừng tự nhiên), khi bé đã học đủ số bài phụ huynh đặt. Không đếm ngược, không khoá cứng. -->
  <div style="position:absolute;left:0;right:0;top:30px;text-align:center;font-size:48px">Nghỉ mắt thôi!</div>
  <!-- Tranh mới (img_ui_nghi_mat): gà con duỗi cánh bên cửa sổ, nét mực -->
  <div class="card" style="position:absolute;left:150px;top:110px;width:400px;height:330px;display:flex;align-items:center;justify-content:center">
    <svg width="360" height="290" fill="none" stroke="#2B2621" stroke-width="2.5" style="position:absolute">
      <rect x="40" y="20" width="280" height="190" rx="6"/><path d="M180 20 v190 M40 115 h280"/>
      <path d="M70 90 q 30 -40 60 0 M220 70 q 25 -30 50 0" stroke-opacity=".5"/><circle cx="270" cy="60" r="18" stroke-opacity=".5"/>
    </svg>
    <img src="../../../../unity/TapDoc/Assets/Content/Resources/images/img_chung_ga_con.png" style="position:absolute;left:120px;top:150px;width:170px;height:170px">
  </div>
  <div class="mark" style="left:135px;top:98px">1</div>
  <!-- 2. Hôm nay bé đã học: hoa của các bài -->
  <div style="position:absolute;left:620px;top:120px;font-size:32px">Hôm nay bé học 3 bài</div>
  <div style="position:absolute;left:620px;top:170px;display:flex;gap:10px">
    <img src="../../../../unity/TapDoc/Assets/Content/Resources/images/img_chung_hoa_be_ngoan.png" style="width:66px"><img src="../../../../unity/TapDoc/Assets/Content/Resources/images/img_chung_hoa_be_ngoan.png" style="width:66px"><img src="../../../../unity/TapDoc/Assets/Content/Resources/images/img_chung_hoa_be_ngoan.png" style="width:66px">
  </div>
  <div class="mark" style="left:600px;top:110px">2</div>
  <!-- 3. Việc làm cùng bố mẹ ngoài màn hình, gắn với bài vừa học -->
  <div class="card" style="position:absolute;left:620px;top:260px;width:460px;padding:16px 20px;font-size:26px;line-height:1.35">
    <span style="font-size:18px;color:var(--muted)">Cho bố mẹ:</span><br>Cùng bố mẹ tìm đồ vật có tiếng chứa <b style="color:var(--teal);font-weight:normal">u</b> hay <b style="color:var(--teal);font-weight:normal">ư</b> nhé: củ từ, cái đu…
  </div>
  <div class="mark" style="left:600px;top:250px">3</div>
  <!-- 4. Nút to "Tạm biệt" về màn chọn bé; phụ huynh cho học thêm qua khoá phép tính (nút nhỏ, chữ) -->
  <div class="pill-btn" style="left:620px;top:430px;background:var(--teal);color:#fff">Tạm biệt <span style="font-size:40px">👋</span></div>
  <div style="position:absolute;left:900px;top:452px;font-size:22px;color:var(--muted);text-decoration:underline">Phụ huynh: học thêm</div>
  <div class="mark" style="left:600px;top:420px">4</div>
</div></body></html>
